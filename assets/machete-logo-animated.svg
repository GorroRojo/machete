<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Machete: a raised finger that is also an exclamation mark">
  <style>
    .finger { transform-box: fill-box; transform-origin: 50% 100%; animation: raise 4s cubic-bezier(.2,.9,.25,1.25) infinite }
    .dot { transform-box: fill-box; transform-origin: 50% 50%; animation: pop 4s ease-out infinite }
    .nail { animation: flash 4s linear infinite }
    @keyframes raise {
      0%, 8% { transform: translateY(70%) scaleY(.35) }
      22% { transform: translateY(-6%) scaleY(1.04) rotate(-5deg) }
      30% { transform: translateY(0) rotate(3deg) }
      36%, 78% { transform: none }
      90%, 100% { transform: translateY(70%) scaleY(.35) }
    }
    @keyframes pop {
      0% { transform: scale(0) }
      8% { transform: scale(1.25) }
      14%, 100% { transform: scale(1) }
    }
    @keyframes flash { 0%, 28% { fill: #E5322D } 32% { fill: #FF8A66 } 38%, 100% { fill: #E5322D } }
    @media (prefers-reduced-motion: reduce) { .finger, .dot, .nail { animation: none } }
  </style>
  <g class="finger">
    <rect x="24" y="3" width="16" height="40" rx="8" fill="#1B1B1B"/>
    <rect class="nail" x="28" y="7" width="8" height="10" rx="3.5" fill="#E5322D"/>
  </g>
  <circle class="dot" cx="32" cy="54" r="7.5" fill="#E5322D"/>
</svg>
